<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule a Lesson - Connor ESL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Palette Overrides to match Academic/Energetic theme */
        body { background-color: #f8f9fa; color: #333333; margin: 0; padding: 0; }
        
        /* Logo constraints */
        .brand img { 
            width: 50px !important; 
            height: 50px !important; 
            object-fit: contain; 
            margin-right: 12px;
        }

        .lesson-options { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        
        /* Updated buttons to match Teal accent */
        .lesson-btn { 
            padding: 15px 20px; 
            background-color: #20c997; 
            color: #ffffff; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
            transition: background-color 0.3s ease;
        }
        .lesson-btn:hover { background-color: #17a589; }
    </style>
</head>
<body>

<header>
    <div class="container nav-wrap">
        <a href="index.html" class="brand">
            <img src="images/cesl-logo.png" alt="Connor ESL Logo" class="cesl-logo">
            <span style="color: #ffffff; font-size: 1.5rem; font-weight: 700;">Connor ESL</span>
        </a>
        <nav class="nav-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="lessons.html">Lessons</a></li>
                <li><a href="schedule.html" class="active">Schedule</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li class="cart-dropdown">
                    <a class="cart-link" id="cart-toggle"><i class="fas fa-shopping-cart"></i> <span id="cart-count">0</span></a>
                    <div class="cart-dropdown-content" id="cart-dropdown"></div>
                </li>
            </ul>
        </nav>
    </div>
</header>

<main class="container">
    <h1>Schedule Your Lesson</h1>
    <p>Select the lesson duration below to book directly on my calendar.</p>
    
    <div class="lesson-options">
        <a href="https://connor-esl.neetocal.com/full-lesson" class="lesson-btn">60-Minute Lesson</a>
        <a href="https://connor-esl.neetocal.com/standard-lesson" class="lesson-btn">45-Minute Lesson</a>
        <a href="https://connor-esl.neetocal.com/free-trial" class="lesson-btn">30-Minute Free Trial</a>
    </div>
</main>

<script>
    // Cart functionality
    const cartToggle = document.getElementById('cart-toggle');
    const cartDropdown = document.getElementById('cart-dropdown');
    
    if (cartToggle) {
        cartToggle.addEventListener('click', function(e) {
            e.preventDefault();
            cartDropdown.classList.toggle('show');
        });
    }

    let cart = JSON.parse(localStorage.getItem('cesl_cart')) || [];
    function updateCartUI() {
        const cartCountElement = document.getElementById('cart-count');
        if (!cartCountElement || !cartDropdown) return;
        cartCountElement.innerText = cart.length;
        if (cart.length === 0) {
            cartDropdown.innerHTML = '<p style="text-align:center; margin: 0; padding: 10px;">Your cart is empty.</p>';
            return;
        }
        let html = '';
        cart.forEach((item, index) => {
            html += `<div class="cart-item"><span>${item.name}</span></div>`;
        });
        cartDropdown.innerHTML = html;
    }
    updateCartUI();
</script>

</body>
</html>

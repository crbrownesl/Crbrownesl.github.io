<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule a Lesson - Connor ESL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; background-color: #fdf6f0; color: #222; margin: 0; padding: 0; overflow-x: hidden; }
        .container { width: 90%; max-width: 1200px; margin: 0 auto; }

        /* Responsive Header */
        header { background-color: #4b2e2e; color: #fff; padding: 1rem 0; }
        .nav-wrap { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
        nav ul { list-style: none; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin-top: 10px; }
        nav a { text-decoration: none; color: #fff; font-weight: bold; }

        /* Main Content */
        main { padding: 2rem 0; text-align: center; }
        .schedule-btn {
            display: block; /* Changed to block so they stack on mobile */
            width: 90%;
            max-width: 300px;
            margin: 15px auto;
            background-color: #4b2e2e;
            color: #fff;
            padding: 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        /* Mobile Breakpoint */
        @media (max-width: 768px) {
            .nav-wrap { flex-direction: column; text-align: center; }
            nav ul { justify-content: center; width: 100%; }
        }
    </style>
</head>

<header>

                <li><a href="about.html">About</a></li>
                <li><a href="lessons.html">Lessons</a></li>
                <li><a href="schedule.html" class="active">Schedule</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a id="cart-toggle"><i class="fas fa-shopping-cart"></i> <span id="cart-count">0</span></a></li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <h1>Schedule Your Lesson</h1>
    <p>Please select one of the options below to book your lesson:</p>

    <a href="https://connor-esl.neetocal.com/full-lesson" target="_blank" class="schedule-btn">Full Lesson - 60 Minutes</a>
    <a href="https://connor-esl.neetocal.com/standard-lesson" target="_blank" class="schedule-btn">Standard Lesson - 45 Minutes</a>

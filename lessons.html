<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lessons - Connor ESL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; background-color: #f9f9f9; margin: 0; overflow-x: hidden; }
        .container { width: 90%; max-width: 1000px; margin: 0 auto; }

        /* Header Navigation - Mobile Responsive */
        header { background-color: #4b2e2e; color: #fff; padding: 1rem 0; }
        .nav-wrap { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
        nav ul { list-style: none; display: flex; flex-wrap: wrap; gap: 15px; margin-top: 10px; }
        nav a { text-decoration: none; color: #fff; font-weight: bold; }

        /* Collapsible Elements */
        .collapsible { background-color: #4b2e2e; color: white; cursor: pointer; padding: 1rem; width: 100%; border: none; text-align: left; border-radius: 5px; margin-top: 1rem; }
        .content { padding: 1rem; display: none; background: #fff; border: 1px solid #ddd; }
        
        /* Mobile-Specific Breakpoint */
        @media (max-width: 768px) {
            .nav-wrap { flex-direction: column; text-align: center; }
            nav ul { justify-content: center; width: 100%; }
            .lesson-item { padding: 1rem 0; }
        }
        
        /* Cart Dropdown fix */
        .cart-dropdown-content { position: absolute; right: 5%; width: 90vw; max-width: 300px; background: #fff; border: 1px solid #ccc; padding: 10px; z-index: 100; display: none; }
    </style>
</head>
<body>

<header>
    <div class="container nav-wrap">
        <a href="index.html" class="brand">
            <h1>Connor ESL</h1>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="lessons.html" class="active">Lessons</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a id="cart-toggle"><i class="fas fa-shopping-cart"></i> <span id="cart-count">0</span></a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="container">
    <h1>Private English Lessons</h1>
    <button class="collapsible">Individual Lessons</button>
    <div class="content">
        <div class="lesson-item">
            <h3>Standard Lesson (45 min) - $15</h3>
            <button class="add-cart-btn" onclick="addToCart('Standard Lesson', 15)">Add to Cart</button>
        </div>
    </div>
</main>

<script>
    // Keep your existing JS logic
    document.querySelectorAll(".collapsible").forEach(btn => {
        btn.addEventListener("click", function() {
            const content = this.nextElementSibling;
            content.style.display = content.style.display === "block" ? "none" : "block";
        });
    });
</script>
</body>
</html>

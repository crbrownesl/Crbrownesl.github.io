<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lessons - Connor ESL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; background-color: #f9f9f9; color: #000; margin: 0; overflow-x: hidden; }
        .container { width: 90%; max-width: 1200px; margin: 0 auto; }

        /* Responsive Header & Nav */
        header { background-color: #4b2e2e; color: #fff; padding: 1rem 0; }
        .nav-wrap { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
        .brand img { height: 50px; border-radius: 5px; }
        nav ul { list-style: none; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin: 0; padding: 0; }
        nav ul li a { text-decoration: none; color: #fff; font-weight: bold; }
        nav ul li a.active { text-decoration: underline; }

        /* Cart Dropdown */
        .cart-dropdown-content { display: none; position: absolute; right: 0; background-color: #fff; color: #000; min-width: 250px; border: 1px solid #ccc; box-shadow: 0 8px 16px rgba(0,0,0,0.2); padding: 10px; z-index: 100; max-height: 300px; overflow-y: auto; border-radius: 5px; }

        /* Lessons Styling */
        .collapsible { background-color: #4b2e2e; color: white; cursor: pointer; padding: 1rem; width: 100%; border: none; text-align: left; font-size: 1.2rem; border-radius: 5px; margin-bottom: 1rem; }
        .content { padding: 1.5rem; display: none; background-color: #fff; border-radius: 0 0 5px 5px; margin-bottom: 2rem; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .lesson-item { text-align: center; padding: 1.5rem 1rem; }
        .add-cart-btn { background-color: #FFD140; color: #000; border: none; padding: 12px 24px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        @media (max-width: 768px) {
            .nav-wrap { flex-direction: column; text-align: center; }
            nav ul { justify-content: center; width: 100%; margin-top: 15px; }
            .cart-dropdown-content { width: 90vw; right: 5%; }
        }
    </style>
</head>
<body>

<header>

            <img src="images/cesl-logo.png" alt="Connor ESL Logo" class="cesl-logo">

                <li class="cart-dropdown">
                  <a class="cart-link" id="cart-toggle" style="cursor:pointer;"><i class="fas fa-shopping-cart"></i> <span id="cart-count">0</span></a>
                  <div class="cart-dropdown-content" id="cart-dropdown"></div>
                </li>
            </ul>
        </nav>
    </div>
</header>

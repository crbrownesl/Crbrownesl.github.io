<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lessons - Connor ESL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background-color: #f8f9fa; color: #333333; margin: 0; padding: 0; }
        .brand img { width: 50px !important; height: 50px !important; object-fit: contain; margin-right: 12px; }
        .lesson-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .lesson-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-top: 5px solid #20c997; }
    </style>
</head>
<body>

<header>
    <div class="container nav-wrap">
        <a href="index.html" class="brand">
            <img src="images/cesl-logo.png" alt="Connor ESL Logo" class="cesl-logo">
            <span style="color: #ffffff; font-size: 1.5rem; font-weight: 700;">Connor ESL</span>
        </a>
        <nav class="nav-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="lessons.html" class="active">Lessons</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li class="cart-dropdown">
                    <a class="cart-link" id="cart-toggle"><i class="fas fa-shopping-cart"></i> <span id="cart-count">0</span></a>
                    <div class="cart-dropdown-content" id="cart-dropdown"></div>
                </li>
            </ul>
        </nav>
    </div>
</header>

<main class="container">
    <h1>Available Lessons</h1>
    <div class="lesson-grid">
        <div class="lesson-card">
            <h3>Standard Package</h3>
            <p>1-on-1 English tutoring for all levels.</p>
            <button class="add-cart-btn" onclick="addToCart('Standard Package', 50)">Add to Cart - $50</button>
        </div>
        <div class="lesson-card">
            <h3>Intensive Course</h3>
            <p>Accelerated learning program.</p>
            <button class="add-cart-btn" onclick="addToCart('Intensive Course', 150)">Add to Cart - $150</button>
        </div>
    </div>
</main>

<script>
    const cartToggle = document.getElementById('cart-toggle');
    const cartDropdown = document.getElementById('cart-dropdown');
    let cart = JSON.parse(localStorage.getItem('cesl_cart')) || [];

    cartToggle.addEventListener('click', (e) => { e.preventDefault(); cartDropdown.classList.toggle('show'); });

    function addToCart(name, price) {
        cart.push({ name, price });
        localStorage.setItem('cesl_cart', JSON.stringify(cart));
        updateCartUI();
    }

    function updateCartUI() {
        document.getElementById('cart-count').innerText = cart.length;
        if (cart.length === 0) {
            cartDropdown.innerHTML = '<p style="text-align:center; padding:10px;">Your cart is empty.</p>';
            return;
        }
        let html = '';
        cart.forEach(item => html += `<div class="cart-item"><span>${item.name}</span><span>$${item.price}</span></div>`);
        cartDropdown.innerHTML = html;
    }
    updateCartUI();
</script>

</body>
</html>

<script>
    // 1. Mobile Menu Toggle Script
    const menuToggle = document.querySelector('.menu-toggle');
    if (menuToggle) {
        menuToggle.addEventListener('click', () => {
            document.querySelector('.nav-menu').classList.toggle('active');
        });
    }

    // 2. Collapsible Lessons Script
    document.querySelectorAll(".collapsible").forEach(btn => {
        btn.addEventListener("click", function() {
            const content = this.nextElementSibling;
            if (content.style.display === "block") {
                content.style.display = "none";
            } else {
                content.style.display = "block";
            }
        });
    });

    // 3. Shopping Cart & PayPal Logic
    // This pulls the cart from the browser's memory, so it stays when you change pages
    let cart = JSON.parse(localStorage.getItem('cesl_cart')) || [];

    function saveCart() {
        localStorage.setItem('cesl_cart', JSON.stringify(cart));
    }

    function addToCart(name, price) {
        cart.push({ name, price });
        saveCart();
        updateCartUI();
        document.getElementById('cart-dropdown').classList.add('show');
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        saveCart();
        updateCartUI();
        document.getElementById('cart-dropdown').classList.add('show');
    }

    function updateCartUI() {
        const cartCountElement = document.getElementById('cart-count');
        const cartDropdown = document.getElementById('cart-dropdown');
        
        // Safety check to ensure the elements exist on the page
        if (!cartCountElement || !cartDropdown) return;

        cartCountElement.innerText = cart.length;
        
        if (cart.length === 0) {
            cartDropdown.innerHTML = '<p style="text-align:center; margin: 0;">Your cart is empty.</p>';
            return;
        }

        let html = '';
        let cartTotal = 0;

        cart.forEach((item, index) => {
            cartTotal += item.price;
            html += `
                <div class="cart-item">
                    <span>${item.name}</span>
                    <div class="item-details">
                        <span>$${item.price}</span>
                        <i class="fas fa-trash remove-btn" onclick="removeFromCart(${index})" title="Remove item"></i>
                    </div>
                </div>`;
        });
        
        html += `<div class="cart-total">Total: $${cartTotal}</div>`;
        html += `<button class="checkout-btn" onclick="checkoutPayPal()" style="border:none; cursor:pointer; font-family:inherit; font-size:1rem;">Proceed to Checkout</button>`; 
        
        cartDropdown.innerHTML = html;
    }

    function checkoutPayPal() {
        if (cart.length === 0) return;

        // Create a hidden form that sends the data to PayPal
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = 'https://www.paypal.com/cgi-bin/webscr';

        // Basic PayPal cart settings updated with your email
        const inputs = {
            cmd: '_cart',
            upload: '1',
            business: 'crbrown.esl@gmail.com',
            currency_code: 'USD'
        };

        for (const key in inputs) {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = inputs[key];
            form.appendChild(input);
        }

        // Add each item in the cart to the PayPal form
        cart.forEach((item, index) => {
            const i = index + 1; // PayPal items start at 1, not 0
            
            const nameInput = document.createElement('input');
            nameInput.type = 'hidden';
            nameInput.name = `item_name_${i}`;
            nameInput.value = item.name;
            form.appendChild(nameInput);

            const priceInput = document.createElement('input');
            priceInput.type = 'hidden';
            priceInput.name = `amount_${i}`;
            priceInput.value = item.price;
            form.appendChild(priceInput);
        });

        document.body.appendChild(form);
        form.submit();
    }

    // Toggle Cart Dropdown manually by clicking the icon
    const cartToggle = document.getElementById('cart-toggle');
    if (cartToggle) {
        cartToggle.addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('cart-dropdown').classList.toggle('show');
        });
    }

    // Initialize empty cart state on page load
    updateCartUI();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Connor ESL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Shared Styles */
        body { font-family: Arial, sans-serif; line-height: 1.6; background-color: #f9f9f9; color: #000; margin: 0; }
        .container { width: 90%; max-width: 1200px; margin: 0 auto; }
        header { background-color: #1a2a3a; color: #fff; padding: 1rem 0; }
        .nav-wrap { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
        .cesl-logo { width: 50px !important; height: 50px !important; object-fit: contain; }
        .nav-menu ul { list-style: none; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin: 0; padding: 0; }
        .nav-menu a { text-decoration: none; color: #fff; font-weight: bold; }
        .nav-menu a.active { color: #20c997; text-decoration: underline; }

        /* Contact Page Styling */
        .contact-section { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-top: 2rem; display: flex; flex-direction: column; gap: 15px; align-items: flex-start; }
        .contact-item { font-size: 1.2rem; display: flex; align-items: center; gap: 15px; }
        .whatsapp-btn { background-color: #25d366; color: #fff; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-flex; align-items: center; gap: 10px; margin-top: 10px; }
        .whatsapp-btn:hover { background-color: #128c7e; }

        /* Cart Dropdown */
        .cart-link { cursor: pointer; color: #fff; }
        .cart-dropdown-content { display: none; position: absolute; right: 0; background-color: #fff; color: #000; min-width: 280px; border: 1px solid #ccc; box-shadow: 0 8px 16px rgba(0,0,0,0.2); z-index: 1000; padding: 1rem; border-radius: 5px; }
        .cart-dropdown-content.show { display: block; }
        .remove-btn { color: #d9534f; cursor: pointer; margin-left: 10px; }
        .checkout-btn { display: block; width: 100%; text-align: center; background: #20c997; color: #fff; text-decoration: none; padding: 10px; margin-top: 10px; border-radius: 5px; border: none; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="container nav-wrap">
        <a href="index.html" class="brand">
            <img src="images/cesl-logo.png" alt="Connor ESL Logo" class="cesl-logo">
            <h1 style="margin: 0; font-size: 1.5rem;">Connor ESL</h1>
        </a>
        <nav class="nav-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="lessons.html">Lessons</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li style="position: relative;">
                    <a class="cart-link" id="cart-toggle"><i class="fas fa-shopping-cart"></i> (<span id="cart-count">0</span>)</a>
                    <div class="cart-dropdown-content" id="cart-dropdown"></div>
                </li>
            </ul>
        </nav>
    </div>
</header>

<main class="container">
    <h1>Contact Me</h1>
    <p>Have questions? Reach out through any of the channels below.</p>
    
    <div class="contact-section">
        <div class="contact-item"><i class="fas fa-envelope"></i> <strong>Email:</strong> crbrown.esl@gmail.com</div>
        <div class="contact-item"><i class="fas fa-phone"></i> <strong>Phone:</strong> +507 6810-3205</div>
        <a href="https://wa.me/50768103205" class="whatsapp-btn" target="_blank">
            <i class="fab fa-whatsapp"></i> Chat on WhatsApp
        </a>
    </div>
</main>

<footer class="container" style="margin-top: 40px; text-align: center; padding-bottom: 20px;">
    <p>&copy; 2026 Connor Brown</p>
</footer>

<script>
    const cartToggle = document.getElementById('cart-toggle');
    const cartDropdown = document.getElementById('cart-dropdown');
    let cart = JSON.parse(localStorage.getItem('cesl_cart')) || [];

    cartToggle.addEventListener('click', (e) => { e.preventDefault(); cartDropdown.classList.toggle('show'); });

    function removeItem(index) {
        cart.splice(index, 1);
        localStorage.setItem('cesl_cart', JSON.stringify(cart));
        updateCartUI();
    }

    function updateCartUI() {
        const countEl = document.getElementById('cart-count');
        if (countEl) countEl.innerText = cart.length;
        if (cart.length === 0) {
            cartDropdown.innerHTML = '<p style="text-align:center; padding:10px;">Your cart is empty.</p>';
            return;
        }
        let html = '';
        cart.forEach((item, index) => {
            html += `<div style="display:flex; justify-content:space-between; padding:5px 0;">
                     ${item.name} <span class="remove-btn" onclick="removeItem(${index})"><i class="fas fa-trash"></i></span></div>`;
        });
        html += `<a href="checkout.html" class="checkout-btn">Checkout</a>`;
        cartDropdown.innerHTML = html;
    }
    updateCartUI();
</script>
</body>
</html>

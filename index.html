<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Connor ESL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; background-color: #f9f9f9; color: #000; margin: 0; }
        .container { width: 90%; max-width: 1200px; margin: 0 auto; }
        header { background-color: #1a2a3a; color: #fff; padding: 1rem 0; }
        .nav-wrap { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; position: relative; }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
        .cesl-logo { width: 50px !important; height: 50px !important; object-fit: contain; }
        
        /* Navigation Styles */
        .nav-menu { display: flex; align-items: center; }
        .nav-menu ul { list-style: none; display: flex; gap: 20px; align-items: center; margin: 0; padding: 0; }
        .nav-menu a { text-decoration: none; color: #fff; font-weight: bold; }
        .nav-menu a.active { color: #20c997; text-decoration: underline; }

        /* Hamburger Styles */
        .hamburger { display: none; cursor: pointer; font-size: 1.8rem; color: #20c997; }

        .hero { text-align: center; padding: 100px 20px !important; background: linear-gradient(rgba(26, 42, 58, 0.7), rgba(26, 42, 58, 0.7)), url('images/classrooms.jpg') !important; background-size: cover !important; background-position: center !important; color: #fff !important; border-radius: 8px !important; margin-top: 20px !important; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin: 3rem 0; }
        .info-box { background: #fff; padding: 1.5rem; border-radius: 8px; border: 1px solid #ddd; }
        .promo-box { background: #1a2a3a; color: #fff; padding: 2rem; border-radius: 8px; margin: 2rem 0; text-align: center; }
        .cta-btn { background-color: #20c997; color: #fff; padding: 15px 30px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; margin-top: 1rem; }
        
        /* Cart Dropdown Styles */
        .cart-link { cursor: pointer; color: #fff; }
        .cart-dropdown-content { display: none; position: absolute; top: 100%; right: 0; background-color: #fff; color: #000; width: 300px; border: 1px solid #ccc; box-shadow: 0 8px 16px rgba(0,0,0,0.2); z-index: 1000; padding: 15px; border-radius: 8px; margin-top: 10px; box-sizing: border-box; }
        .cart-dropdown-content.show { display: block; }
        .cart-item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.95rem; }
        .cart-total { border-top: 1px solid #eee; padding-top: 10px; margin-top: 10px; font-weight: bold; display: flex; justify-content: space-between; }
        .remove-btn { color: #d9534f; cursor: pointer; margin-left: 10px; }
        .checkout-btn { display: block; width: 100%; text-align: center; background: #20c997; color: #fff; text-decoration: none; padding: 12px; margin-top: 15px; border-radius: 5px; font-weight: bold; box-sizing: border-box; }
        
        #google_translate_element { margin-left: 10px; }
        .goog-te-gadget-simple { background-color: #1a2a3a !important; border: 1px solid #20c997 !important; padding: 5px !important; border-radius: 5px !important; }
        .goog-te-gadget-simple span { color: #fff !important; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .hamburger { display: block; }
            .nav-menu ul { display: none; flex-direction: column; width: 100%; background: #1a2a3a; padding: 1rem 0; position: absolute; top: 100%; left: 0; z-index: 1001; }
            .nav-menu ul.active { display: flex; }
            .nav-menu ul li { margin-bottom: 15px; }
            .cart-dropdown-content { right: 0; left: auto; }
        }
    </style>
</head>
<body>

<header>
    <div class="container nav-wrap">
        <a href="index.html" class="brand">
            <img src="images/cesl-logo.png" alt="Connor ESL Logo" class="cesl-logo">
            <h1 style="margin: 0; font-size: 1.5rem;">Connor ESL</h1>
        </a>
        
        <div class="hamburger" id="hamburger"><i class="fas fa-bars"></i></div>

        <nav class="nav-menu">
            <ul id="nav-list">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="lessons.html">Lessons</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li style="position: relative; display: flex; align-items: center;">
                    <a class="cart-link" id="cart-toggle"><i class="fas fa-shopping-cart"></i> (<span id="cart-count">0</span>)</a>
                    <div class="cart-dropdown-content" id="cart-dropdown"></div>
                    <div id="google_translate_element"></div>
                </li>
            </ul>
        </nav>
    </div>
</header>

<script>
    // Hamburger Logic
    const hamburger = document.getElementById('hamburger');
    const navList = document.getElementById('nav-list');
    hamburger.addEventListener('click', () => { navList.classList.toggle('active'); });

    // Cart Logic
    const cartToggle = document.getElementById('cart-toggle');
    const cartDropdown = document.getElementById('cart-dropdown');
    let cart = JSON.parse(localStorage.getItem('cesl_cart')) || [];

    cartToggle.addEventListener('click', (e) => { e.preventDefault(); cartDropdown.classList.toggle('show'); });

    // Close when clicking outside
    window.addEventListener('click', (e) => {
        if (!cartToggle.contains(e.target) && !cartDropdown.contains(e.target)) {
            cartDropdown.classList.remove('show');
        }
    });

    function removeItem(index) { cart.splice(index, 1); localStorage.setItem('cesl_cart', JSON.stringify(cart)); updateCartUI(); }

    function updateCartUI() {
        const countEl = document.getElementById('cart-count');
        if (countEl) countEl.innerText = cart.length;
        if (cart.length === 0) { cartDropdown.innerHTML = '<p style="text-align:center;">Your cart is empty.</p>'; return; }
        let html = '<div style="max-height: 200px; overflow-y: auto;">';
        let total = 0;
        cart.forEach((item, index) => {
            total += item.price;
            html += `<div class="cart-item-row"><span>${item.name} - $${item.price}</span><span class="remove-btn" onclick="removeItem(${index})" style="color:red; cursor:pointer;"><i class="fas fa-trash"></i></span></div>`;
        });
        html += `</div><div class="cart-total"><span>Total:</span> <span>$${total}</span></div><a href="checkout.html" class="checkout-btn">Checkout</a>`;
        cartDropdown.innerHTML = html;
    }
    updateCartUI();
</script>
</body>
</html>
